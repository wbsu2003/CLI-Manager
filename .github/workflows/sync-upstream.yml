name: Sync Upstream

# 定时跟踪上游 dark-hxx/CLI-Manager 的「正式版」:发现上游出现本 fork 尚未构建对应
# x64 包的 V* 桌面 tag 时,触发 release-macos-x64.yml 构建 macOS Intel (x64) dmg。
#
# 设计:全程用 git ls-remote 远程查询(上游最新正式 tag vs 本 fork 已构建的 *-x64 tag),
# 不 checkout、不 merge、不 push,零冲突、零历史污染。

on:
  schedule:
    - cron: "17 */12 * * *"   # 每 12 小时检查一次上游
  workflow_dispatch: {}        # 也支持手动触发

permissions:
  contents: read
  actions: write    # gh workflow run 触发构建

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Detect new upstream desktop release
        id: detect
        shell: bash
        run: |
          # 上游最新「正式」桌面 tag
          LATEST="$(git ls-remote --tags https://github.com/${{ vars.UPSTREAM_REPO || 'dark-hxx/CLI-Manager' }}.git 'refs/tags/V*' | grep -oE 'V[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          if [ -z "$LATEST" ]; then
            echo "::notice::no upstream desktop V* tag found"
            echo "need_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 本 fork 已构建的 *-x64 tag 列表
          BUILT="$(git ls-remote --tags https://github.com/${{ github.repository }}.git 'refs/tags/V*-x64' | grep -oE 'V[0-9]+\.[0-9]+\.[0-9]+-x64$')"
          echo "latest upstream desktop tag : $LATEST"
          echo "fork already built x64 tags : ${BUILT:-<none>}"
          echo "upstream_tag=$LATEST" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$BUILT" | grep -Fxq "${LATEST}-x64"; then
            echo "already built ${LATEST}-x64, nothing to do"
            echo "need_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "need build ${LATEST}-x64"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger macOS x64 build
        if: steps.detect.outputs.need_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ steps.detect.outputs.upstream_tag }}
        run: gh workflow run release-macos-x64.yml -f upstream_tag="${UPSTREAM_TAG}"
